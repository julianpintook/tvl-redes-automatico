name: Automático TVL Redes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_calendars:
        description: 'Regenerar calendarios ahora'
        type: boolean
        default: false
      force_backup:
        description: 'Hacer la copia de seguridad ahora'
        type: boolean
        default: false
      force_cleanup:
        description: 'Hacer la limpieza ahora'
        type: boolean
        default: false

concurrency:
  group: automatico
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node run.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          FORCE_CALENDARS: ${{ inputs.force_calendars && '1' || '' }}
          FORCE_BACKUP: ${{ inputs.force_backup && '1' || '' }}
          FORCE_CLEANUP: ${{ inputs.force_cleanup && '1' || '' }}
